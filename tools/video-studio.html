<script>
"use strict";
const W=1280,H=720,FPS=30,SAVE="http://127.0.0.1:8766/";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const log=(...a)=>{document.getElementById("log").textContent+=a.join(" ")+"\n";console.log(...a)};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fit(c,t,w){if(c.measureText(t).width<=w)return t;while(t.length>1&&c.measureText(t+"…").width>w)t=t.slice(0,-1);return t.trim()+"…"}
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---------- Сценарій: репліки сцени «Маяк» (власний текст KinoUA) ---------- */
const CUES=[
{at:1.2,wav:"l1",en:"The storm is getting worse.",uk:"Буря посилюється.",ru:"Буря усиливается."},
{at:4.2,wav:"l2",en:"I can't give up now.",uk:"Я не можу здатися зараз.",ru:"Я не могу сдаться сейчас."},
{at:6.8,wav:"l3",en:"The light has to keep burning.",uk:"Світло має горіти й далі.",ru:"Свет должен гореть и дальше."},
{at:10.4,wav:"l4",en:"Then let's climb up and check the lamp.",uk:"Тоді піднімімося й перевірмо лампу.",ru:"Тогда давай поднимемся и проверим лампу."},
{at:14.0,wav:"l5",en:"Hold on tight. We're almost there.",uk:"Тримайся міцно. Ми майже прийшли.",ru:"Держись крепче. Мы почти пришли."},
{at:18.6,wav:"l6",en:"Look! The ship has seen the light.",uk:"Дивись! Корабель побачив світло.",ru:"Смотри! Корабль увидел свет."}];
const SCENE_LEN=24;
let AUD={};
async function loadAudio(){const ac=new OfflineAudioContext(2,48000,48000);for(const n of["l1","l2","l3","l4","l5","l6","l7"]){const b=await (await fetch("voice/"+n+".wav")).arrayBuffer();AUD[n]=await ac.decodeAudioData(b)}
CUES.forEach(c=>{c.end=c.at+AUD[c.wav].duration;c.t0=+(c.at-0.15).toFixed(2);c.t1=+(c.end+0.55).toFixed(2)})}
function cueAt(t){return CUES.find(c=>t>=c.t0&&t<c.t1)}

/* ---------- Попередньо намальовані шари ---------- */
let CLOUD,GRAIN,POSTERS=[],LH_POSTER,STILL;
function makeLayers(){
CLOUD=document.createElement("canvas");CLOUD.width=2560;CLOUD.height=420;const c=CLOUD.getContext("2d");c.filter="blur(28px)";const r=rnd(7);
for(let i=0;i<46;i++){const x=r()*2560,y=40+r()*300,w=160+r()*360,h=50+r()*90;c.fillStyle=`rgba(${20+r()*30|0},${45+r()*35|0},${58+r()*40|0},${.35+r()*.4})`;c.beginPath();c.ellipse(x,y,w,h,0,0,7);c.fill();if(x<400){c.beginPath();c.ellipse(x+2560,y,w,h,0,0,7);c.fill()}}
GRAIN=document.createElement("canvas");GRAIN.width=GRAIN.height=256;const g=GRAIN.getContext("2d"),id=g.createImageData(256,256),rr2=rnd(3);
for(let i=0;i<id.data.length;i+=4){const v=rr2()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)}
async function svgBitmap(svg,w,h){const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);await img.decode();const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);return c}
// Справжні тайтли каталогу (постери TMDB з assets/posters). На сайті для них доступні опис і трейлер, тому підпис — «Трейлер».
async function makePosters(){for(const id of["dune-part-two-2024","interstellar-2014","coco-2017","the-wild-robot-2024","spider-man-across-the-spider-verse-2023"]){const m=MOVIES.find(x=>x.id===id),img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error("poster "+id));img.src="../"+m.poster});const c=document.createElement("canvas");c.width=400;c.height=600;c.getContext("2d").drawImage(img,0,0,400,600);POSTERS.push({t:m.n.uk||m.t,c})}
LH_POSTER=document.createElement("canvas");LH_POSTER.width=400;LH_POSTER.height=600;const p=LH_POSTER.getContext("2d");p.save();p.translate(-640,-30);p.scale(1.15,1.15);drawScene(p,8.5,{noGrain:true});p.restore();
const gr=p.createLinearGradient(0,330,0,600);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(0,0,0,.8)");p.fillStyle=gr;p.fillRect(0,0,400,600);
p.fillStyle="#fff";p.font="700 64px Inter";p.textAlign="center";p.fillText("МАЯК",200,540);
STILL=document.createElement("canvas");STILL.width=W;STILL.height=H;drawScene(STILL.getContext("2d"),7.2,{})}

/* ---------- Оригінальна анімована сцена: маяк у бурю ---------- */
function drawScene(c,t,o){o=o||{};c.save();
const zoom=1+0.07*ease(clamp(t/SCENE_LEN)),flash=(t>9&&t<9.12)||(t>9.28&&t<9.36)?1:0;
c.translate(900,360);c.scale(zoom,zoom);c.translate(-900,-360);if(flash)c.translate(Math.sin(t*90)*3,0);
let g=c.createLinearGradient(0,0,0,470);g.addColorStop(0,"#040b12");g.addColorStop(.6,"#0c2430");g.addColorStop(1,"#1c4a55");c.fillStyle=g;c.fillRect(-100,-100,W+200,580);
const sr=rnd(11);c.fillStyle="#cfe3e8";for(let i=0;i<70;i++){const x=sr()*W,y=sr()*300,a=.15+.35*Math.abs(Math.sin(t*1.3+i));c.globalAlpha=a*.6;c.fillRect(x,y,1.6,1.6)}c.globalAlpha=1;

// промінь маяка
const LX=1012,LY=158,ang=Math.PI+Math.sin(t*0.55)*0.75,len=1500,spread=0.11+0.03*Math.sin(t*2.1);

c.save();c.globalCompositeOperation="lighter";g=c.createRadialGradient(LX,LY,0,LX,LY,len);g.addColorStop(0,`rgba(255,232,160,${.55*lampOn})`);g.addColorStop(.35,`rgba(255,226,150,${.16*lampOn})`);g.addColorStop(1,"rgba(255,220,140,0)");
c.fillStyle=g;c.beginPath();c.moveTo(LX,LY);c.lineTo(LX+Math.cos(ang-spread)*len,LY+Math.sin(ang-spread)*len*.35);c.lineTo(LX+Math.cos(ang+spread)*len,LY+Math.sin(ang+spread)*len*.35);c.closePath();c.fill();c.restore();
// море
g=c.createLinearGradient(0,440,0,H);g.addColorStop(0,"#0f3540");g.addColorStop(1,"#03090c");c.fillStyle=g;c.fillRect(-100,440,W+200,H-380);
for(let k=0;k<7;k++){const y=455+k*k*6.5,amp=3+k*2.2,sp=.6+k*.25;c.beginPath();c.moveTo(-100,y);for(let x=-100;x<=W+100;x+=20)c.lineTo(x,y+Math.sin(x*.012+t*sp+k)*amp+Math.sin(x*.031-t*sp*1.3)*amp*.4);
c.strokeStyle=`rgba(140,215,225,${.06+k*.025})`;c.lineWidth=1.2+k*.35;c.stroke()}
// корабель
const shipX=330+t*7,turn=seg(t,18.8,22);c.save();c.translate(shipX,452);c.scale(1-turn*1.6>-1?1-turn*1.6:-1,1);c.fillStyle="#050c10";c.beginPath();c.moveTo(-40,0);c.lineTo(40,0);c.lineTo(30,10);c.lineTo(-34,10);c.closePath();c.fill();c.fillRect(-14,-14,22,14);c.fillRect(-4,-26,4,12);
c.fillStyle=`rgba(255,214,120,${.7+.3*Math.sin(t*5)})`;c.fillRect(-10,-9,4,3);c.fillRect(0,-9,4,3);c.fillStyle=t>19?"#7dffb2":"#ff6b5a";c.beginPath();c.arc(-2,-28,2.2,0,7);c.fill();c.restore();
// скеля
c.fillStyle="#061015";c.beginPath();c.moveTo(720,H);c.lineTo(760,500);c.lineTo(820,468);c.lineTo(900,452);c.lineTo(980,440);c.lineTo(1100,438);c.lineTo(1200,450);c.lineTo(W+100,470);c.lineTo(W+100,H);c.closePath();c.fill();
c.strokeStyle="rgba(120,200,210,.12)";c.lineWidth=2;c.beginPath();c.moveTo(760,500);c.lineTo(820,468);c.lineTo(900,452);c.lineTo(980,440);c.lineTo(1100,438);c.stroke();
// маяк
c.save();c.beginPath();c.moveTo(978,440);c.lineTo(1046,440);c.lineTo(1034,190);c.lineTo(990,190);c.closePath();c.clip();
for(let i=0;i<6;i++){c.fillStyle=i%2?"#d8d2c4":"#7a2b2b";c.fillRect(960,190+i*42,110,42)}g=c.createLinearGradient(978,0,1046,0);g.addColorStop(0,"rgba(0,0,0,.55)");g.addColorStop(.45,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.65)");c.fillStyle=g;c.fillRect(960,180,110,270);c.restore();
c.fillStyle="#141b20";c.fillRect(980,180,64,12);c.fillRect(976,178,72,4);
c.fillStyle=`rgba(255,226,140,${.6+.4*lampOn})`;c.fillRect(994,146,36,32);c.strokeStyle="#141b20";c.lineWidth=3;c.strokeRect(994,146,36,32);c.beginPath();c.moveTo(1012,146);c.lineTo(1012,178);c.stroke();
c.fillStyle="#141b20";c.beginPath();c.moveTo(988,146);c.lineTo(1036,146);c.lineTo(1012,124);c.closePath();c.fill();
c.save();c.globalCompositeOperation="lighter";g=c.createRadialGradient(LX,LY,0,LX,LY,120);g.addColorStop(0,`rgba(255,230,150,${.55*lampOn})`);g.addColorStop(1,"rgba(255,230,150,0)");c.fillStyle=g;c.fillRect(LX-120,LY-120,240,240);c.restore();
c.fillStyle="rgba(255,214,120,.85)";c.fillRect(1006,400,12,22);
// персонажі
const walk=ease(seg(t,14,18.2)),kx=lerp(872,936,walk),gx=lerp(842,906,walk),bob=Math.sin(t*9)*(walk>0&&walk<1?2:0);
drawKeeper(c,kx,454+bob,t);drawGirl(c,gx,456-bob,t);
// дощ
const rr3=rnd(5);c.strokeStyle="rgba(190,225,235,.22)";c.lineWidth=1.2;c.beginPath();for(let i=0;i<220;i++){const x0=rr3()*1500-100,y0=rr3()*H,sp=700+rr3()*500,y=(y0+t*sp)%(H+40)-20,x=x0-((t*sp)%(H+40))*.18;c.moveTo(x,y);c.lineTo(x-5,y+22)}c.stroke();
if(flash){c.fillStyle="rgba(220,240,255,.28)";c.fillRect(-100,-100,W+200,H+200);c.strokeStyle="rgba(235,245,255,.95)";c.lineWidth=3;c.beginPath();c.moveTo(420,0);c.lineTo(440,90);c.lineTo(410,140);c.lineTo(450,230);c.lineTo(432,300);c.stroke()}
c.restore();
// віньєтка й зерно
g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.6)");c.fillStyle=g;c.fillRect(0,0,W,H);
if(!o.noGrain){c.save();c.globalAlpha=.045;c.globalCompositeOperation="overlay";const ox=(t*977%256)|0,oy=(t*631%256)|0;for(let x=-ox;x<W;x+=256)for(let y=-oy;y<H;y+=256)c.drawImage(GRAIN,x,y);c.restore()}}
function drawKeeper(c,x,y,t){c.save();c.translate(x,y);c.fillStyle="#03080b";c.beginPath();c.moveTo(-11,0);c.lineTo(-14,-46);c.quadraticCurveTo(-12,-62,0,-64);c.quadraticCurveTo(12,-62,13,-46);c.lineTo(12,0);c.closePath();c.fill();
c.beginPath();c.arc(0,-72,8,0,7);c.fill();c.fillRect(-12,-80,24,4);c.fillRect(-7,-88,14,9);
c.strokeStyle="#03080b";c.lineWidth=5;c.lineCap="round";c.beginPath();c.moveTo(10,-50);c.lineTo(20,-30);c.stroke();
c.fillStyle="rgba(255,210,120,.95)";c.fillRect(17,-30,7,9);c.globalCompositeOperation="lighter";const g=c.createRadialGradient(20,-25,0,20,-25,40);g.addColorStop(0,"rgba(255,200,110,.45)");g.addColorStop(1,"rgba(255,200,110,0)");c.fillStyle=g;c.fillRect(-20,-65,80,80);c.restore()}
function drawGirl(c,x,y,t){c.save();c.translate(x,y);c.fillStyle="#03080b";c.beginPath();c.moveTo(-9,0);c.lineTo(-10,-34);c.quadraticCurveTo(-8,-46,0,-47);c.quadraticCurveTo(8,-46,9,-34);c.lineTo(9,0);c.closePath();c.fill();
c.beginPath();c.arc(0,-54,7,0,7);c.fill();c.strokeStyle="#3a1a40";c.lineWidth=4;c.lineCap="round";c.beginPath();c.moveTo(-4,-45);c.quadraticCurveTo(-18,-44+Math.sin(t*8)*4,-30,-40+Math.sin(t*6)*6);c.stroke();c.restore()}

/* ---------- Елементи інтерфейсу KinoUA ---------- */
const C={bg:"#111318",sf:"#1B1E25",sf2:"#242833",ac:"#7C5CFC",btn:"#6E4EF2",ac2:"#A68FFF",tx:"#E7E9EF",mu:"#9AA0AE",ln:"#2C303B",teal:"#4FD1C5"};
function font(w,s){return w+" "+s+"px Inter"}
function mark(c,x,y,s){c.save();c.translate(x,y);c.scale(s/64,s/64);const g=c.createLinearGradient(0,0,64,64);g.addColorStop(0,"#9A80FF");g.addColorStop(1,"#5B3DDB");c.fillStyle=g;rr(c,0,0,64,64,16);c.fill();
c.fillStyle="#fff";c.strokeStyle="#fff";c.lineWidth=4;c.lineJoin="round";c.beginPath();c.moveTo(25,13.5);c.lineTo(44,25);c.lineTo(25,36.5);c.closePath();c.fill();c.stroke();rr(c,13,44,38,5.5,2.75);c.fill();c.globalAlpha=.6;rr(c,20,52.5,24,4.5,2.25);c.fill();c.restore()}
function brandBg(c,t){c.fillStyle="#0B0C10";c.fillRect(0,0,W,H);c.save();c.strokeStyle="rgba(79,209,197,.07)";c.lineWidth=1;for(let x=-40+(t*8%40);x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.restore();
let g=c.createRadialGradient(W*.5,H*.62,0,W*.5,H*.62,560);g.addColorStop(0,"rgba(124,92,252,.38)");g.addColorStop(1,"rgba(124,92,252,0)");c.fillStyle=g;c.fillRect(0,0,W,H);
g=c.createRadialGradient(W*.15,H*.1,0,W*.15,H*.1,420);g.addColorStop(0,"rgba(79,209,197,.14)");g.addColorStop(1,"rgba(79,209,197,0)");c.fillStyle=g;c.fillRect(0,0,W,H)}
function cursor(c,x,y,click){c.save();if(click>0&&click<1){c.strokeStyle=`rgba(166,143,255,${1-click})`;c.lineWidth=3;c.beginPath();c.arc(x,y,8+click*30,0,7);c.stroke()}
c.translate(x,y);c.fillStyle="#fff";c.strokeStyle="#111";c.lineWidth=1.5;c.beginPath();c.moveTo(0,0);c.lineTo(0,22);c.lineTo(6,17);c.lineTo(10,26);c.lineTo(14,24);c.lineTo(10,15);c.lineTo(18,15);c.closePath();c.fill();c.stroke();c.restore()}
function stepChip(c,n,label,a){if(a<=0)return;c.save();c.globalAlpha=a;c.font=font(600,20);const w=c.measureText(label).width+86;c.fillStyle="rgba(11,12,16,.78)";rr(c,32,96,w,48,24);c.fill();c.strokeStyle="rgba(166,143,255,.5)";c.lineWidth=1.5;c.stroke();
c.fillStyle=C.btn;c.beginPath();c.arc(56,120,16,0,7);c.fill();c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";c.fillText(n,56,121);c.textAlign="left";c.fillText(label,82,121);c.restore()}
function btn(c,x,y,w,h,label,primary,hover){c.fillStyle=primary?(hover?"#5F3FE3":C.btn):"rgba(255,255,255,.12)";rr(c,x,y,w,h,h/2);c.fill();if(!primary){c.strokeStyle="rgba(255,255,255,.38)";c.lineWidth=1.5;c.stroke()}
c.fillStyle="#fff";c.font=font(600,20);c.textAlign="center";c.textBaseline="middle";c.fillText(label,x+w/2,y+h/2+1);c.textAlign="left"}
function header(c){c.fillStyle="rgba(17,19,24,.92)";c.fillRect(0,0,W,76);c.strokeStyle=C.ln;c.beginPath();c.moveTo(0,76);c.lineTo(W,76);c.stroke();mark(c,32,20,36);c.font=font(700,24);c.fillStyle=C.tx;c.textBaseline="middle";c.fillText("Kino",78,39);c.fillStyle=C.ac2;c.fillText("UA",78+c.measureText("Kino").width,39);
c.fillStyle=C.sf;rr(c,380,18,470,42,21);c.fill();c.font=font(500,17);[["Фільми",404],["Серіали",520],["Мультфільми",630],["Пошук",772]].forEach(([s,x],i)=>{if(!i){c.fillStyle=C.sf2;rr(c,x-14,23,100,32,16);c.fill()}c.fillStyle=i?C.mu:C.tx;c.fillText(s,x,40)});
c.fillStyle=C.sf;rr(c,1000,20,128,38,19);c.fill();c.fillStyle=C.btn;rr(c,1004,24,40,30,15);c.fill();c.font=font(600,14);c.fillStyle="#fff";c.fillText("UA",1012,40);c.fillStyle=C.mu;c.fillText("RU",1054,40);c.fillText("EN",1093,40);
c.fillStyle=C.sf;rr(c,1140,20,110,38,19);c.fill();c.fillStyle=C.tx;c.font=font(600,15);c.fillText("Увійти",1172,40)}
function subsBox(c,lines,o){o=o||{};const size=o.size||34,gap=size*.38,bottom=o.bottom||70;let y=H-bottom;c.save();c.textAlign="center";c.textBaseline="alphabetic";
for(let i=lines.length-1;i>=0;i--){const L=lines[i],fs=i?size*.82:size;c.font=font(i?500:600,fs);const w=c.measureText(L.text).width,tagW=o.tags?44:0;
if(o.bg!==false){c.fillStyle=`rgba(0,0,0,${o.bgA||.55})`;rr(c,W/2-w/2-18-tagW/2,y-fs-6,w+36+tagW,fs+18,10);c.fill()}
if(o.tags){c.fillStyle=i?"rgba(166,143,255,.9)":"rgba(255,255,255,.85)";rr(c,W/2-w/2-tagW/2-8,y-fs*.78,36,fs*.62,6);c.fill();c.fillStyle="#111";c.font=font(700,fs*.36);c.fillText(L.tag,W/2-w/2-tagW/2+10,y-fs*.33);c.font=font(i?500:600,fs)}
c.fillStyle=i?"#D9CFFF":"#fff";c.shadowColor="rgba(0,0,0,.8)";c.shadowBlur=o.bg===false?8:0;c.fillText(L.text,W/2+tagW/2,y);c.shadowBlur=0;
if(L.hl){const pre=L.text.slice(0,L.text.indexOf(L.hl)),x0=W/2+tagW/2-w/2+c.measureText(pre).width,hw=c.measureText(L.hl).width;c.fillStyle="#FFD84D";rr(c,x0-4,y-fs+2,hw+8,fs+8,6);c.fill();c.fillStyle="#111318";c.textAlign="left";c.fillText(L.hl,x0,y);c.textAlign="center"}

/* ---------- Звук ---------- */
function noiseBuf(ac,sec){const b=ac.createBuffer(2,ac.sampleRate*sec,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}}return b}
function ambience(ac,t0,dur,gain){const n=ac.createBufferSource();n.buffer=noiseBuf(ac,dur);const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=900;const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.8);g.gain.setValueAtTime(gain,t0+dur-1);g.gain.linearRampToValueAtTime(0,t0+dur);
const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.12;lg.gain.value=gain*.4;lfo.connect(lg).connect(g.gain);lfo.start(t0);lfo.stop(t0+dur);n.connect(f).connect(g).connect(ac.destination);n.start(t0)}
function thunder(ac,t0){const n=ac.createBufferSource();n.buffer=noiseBuf(ac,3);const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=180;const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.9,t0+.08);g.gain.exponentialRampToValueAtTime(.001,t0+2.8);n.connect(f).connect(g).connect(ac.destination);n.start(t0)}
function pad(ac,t0,dur,gain){const chords=[[220,277.18,329.63],[196,246.94,293.66],[174.61,220,261.63],[196,246.94,329.63]];const step=dur/chords.length;
chords.forEach((ch,i)=>ch.forEach(fq=>{const o=ac.createOscillator();o.type="triangle";o.frequency.value=fq/2;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=700;const g=ac.createGain();const s=t0+i*step;
g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(gain,s+1.2);g.gain.setValueAtTime(gain,s+step-.6);g.gain.linearRampToValueAtTime(0,s+step+.6);o.connect(f).connect(g).connect(ac.destination);o.start(s);o.stop(s+step+.7)}))}
function click(ac,t0){const o=ac.createOscillator();o.frequency.value=1800;const g=ac.createGain();g.gain.setValueAtTime(.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.06);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+.08)}
function voice(ac,name,t0,gain){const s=ac.createBufferSource();s.buffer=AUD[name];const g=ac.createGain();g.gain.value=gain||1.3;s.connect(g).connect(ac.destination);s.start(t0)}
async function sceneAudio(){const ac=new OfflineAudioContext(2,48000*SCENE_LEN,48000);ambience(ac,0,SCENE_LEN,.16);thunder(ac,9.05);pad(ac,0,SCENE_LEN,.025);CUES.forEach(c=>voice(ac,c.wav,c.at));return ac.startRendering()}

CUES.forEach(c=>{if(PLAY0+c.at<PLAY1)voice(ac,c.wav,PLAY0+c.at)});[8.9,12.9,PLAY0+11.3,PLAY0+16,PLAY0+17.4,38.05].forEach(x=>click(ac,x));voice(ac,"l7",39.25,1.4);click(ac,41.25);return ac.startRendering()}

async function encode(name,len,draw,audioBuf,bitrate){const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:"avc",width:W,height:H,frameRate:FPS},audio:{codec:"aac",numberOfChannels:2,sampleRate:48000},fastStart:"in-memory"});
const ve=new VideoEncoder({output:(ch,m)=>muxer.addVideoChunk(ch,m),error:e=>log("VE error",e.message)});ve.configure({codec:"avc1.640028",width:W,height:H,bitrate,framerate:FPS,latencyMode:"quality"});
const n=Math.round(len*FPS);for(let i=0;i<n;i++){draw(ctx,i/FPS);const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(f,{keyFrame:i%(FPS*2)===0});f.close();
if(ve.encodeQueueSize>6)await new Promise(r=>ve.addEventListener("dequeue",r,{once:true}));if(i%150===0)log(name,"frame",i,"/",n)}
await ve.flush();
const ae=new AudioEncoder({output:(ch,m)=>muxer.addAudioChunk(ch,m),error:e=>log("AE error",e.message)});ae.configure({codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:128000});
const L=audioBuf.getChannelData(0),R=audioBuf.getChannelData(1),N=1024;for(let i=0;i<L.length;i+=N){const k=Math.min(N,L.length-i),d=new Float32Array(k*2);d.set(L.subarray(i,i+k),0);d.set(R.subarray(i,i+k),k);
const ad=new AudioData({format:"f32-planar",sampleRate:48000,numberOfFrames:k,numberOfChannels:2,timestamp:Math.round(i/48000*1e6),data:d});ae.encode(ad);ad.close()}
await ae.flush();muxer.finalize();const buf=muxer.target.buffer;log(name,"bytes",buf.byteLength);await save(name,new Blob([buf],{type:"video/mp4"}))}
async function save(name,blob){const r=await fetch(SAVE+name,{method:"POST",body:blob});log("save",name,r.status,await r.text())}
async function jpg(name,draw,t){draw(ctx,t);await save(name,await new Promise(r=>cv.toBlob(r,"image/jpeg",.86)))}
function vtt(lang){const f=s=>{const m=Math.floor(s/60),x=(s%60).toFixed(3).padStart(6,"0");return`00:${String(m).padStart(2,"0")}:${x}`};return"WEBVTT\n\n"+CUES.map((c,i)=>`${i+1}\n${f(c.t0)} --> ${f(c.t1)}\n${c[lang]}\n`).join("\n")}
async function ready(){await document.fonts.load("600 30px Inter","Ії");await document.fonts.load("700 30px Inter","Ії");await document.fonts.load("500 30px Inter","Ії");await document.fonts.load("400 30px Inter","Ії");await loadAudio();makeLayers();await makePosters();log("ready",CUES.map(c=>c.t0+"-"+c.t1).join(" "))}

window.makeDemo=async()=>{await RDY;const a=await demoAudio();await encode("kinoua-demo.mp4",DEMO_LEN,demoFrame,a,2600000);await jpg("kinoua-demo-poster.jpg",demoFrame,PLAY0+5.0);log("DEMO DONE")};
window.preview=async t=>{await RDY;demoFrame(ctx,t)};
document.getElementById("b1").onclick=()=>makeScene();document.getElementById("b2").onclick=()=>makeDemo();document.getElementById("pv").onclick=()=>preview(+document.getElementById("pt").value);
</script></body></html>
